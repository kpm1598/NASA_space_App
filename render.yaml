# Render Blueprint — deploys BLACKCAT as two free services:
#   blackcat-api : FastAPI backend (auto-loads the bundled FIRMS dataset
#                  on first boot because BLACKCAT_AUTOFILL_SAMPLES=1)
#   blackcat-web : React frontend (static site), built with
#                  VITE_API_BASE pointing at the backend service.
# NOTE: the plain name "blackcat-api" was already taken on Render by an
# unrelated project, so this backend's real URL is
# https://blackcat-api-19au.onrender.com — VITE_API_BASE below points
# there. If the backend service is ever recreated and gets a new URL,
# update VITE_API_BASE to match and redeploy the static site.
services:
  - type: web
    name: blackcat-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: BLACKCAT_AUTOFILL_SAMPLES
        value: "1"
  - type: web
    name: blackcat-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://blackcat-api-19au.onrender.com
