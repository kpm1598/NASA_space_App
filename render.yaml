# Render Blueprint — deploys BLACKCAT as two free services:
#   blackcat-api : FastAPI backend (auto-loads the bundled FIRMS dataset
#                  on first boot because BLACKCAT_AUTOFILL_SAMPLES=1)
#   blackcat-web : React frontend (static site), built with
#                  VITE_API_BASE pointing at the backend service.
# If Render says the service name "blackcat-api" is taken, the backend
# URL changes — update VITE_API_BASE in the blackcat-web service
# settings to the real backend URL and redeploy the static site.
services:
  - type: web
    name: blackcat-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: BLACKCAT_AUTOFILL_SAMPLES
        value: "1"
  - type: web
    name: blackcat-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://blackcat-api.onrender.com
